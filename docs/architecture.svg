<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-label="Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#191622"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#565f89"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7aa2f7"/>
    </marker>
    <style>
      .t   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .h   { fill: #c0caf5; font-size: 15px; font-weight: 600; }
      .lbl { fill: #a9b1d6; font-size: 13px; }
      .dim { fill: #565f89; font-size: 12px; }
      .acc { fill: #7aa2f7; font-size: 12px; }
      .grn { fill: #9ece6a; font-size: 12px; }
      .pur { fill: #bb9af7; font-size: 12px; }
    </style>
  </defs>

  <rect width="1120" height="640" rx="20" fill="url(#bg)"/>

  <text class="s h" x="48" y="52" font-size="18">How it fits together</text>
  <text class="s dim" x="48" y="76">Two entry points, one core, one repository.</text>

  <!-- entry points -->
  <g transform="translate(48 108)">
    <rect width="300" height="112" rx="12" fill="#1a1e2b" stroke="#3b4261" stroke-width="1.5"/>
    <text class="s h" x="20" y="30">Entry points</text>
    <text class="t acc" x="20" y="58">OpenCode plugin</text>
    <text class="t dim" x="20" y="76">startup pull · idle push · opencode_sync tool</text>
    <text class="t acc" x="20" y="96">opencode-sync CLI</text>
  </g>

  <!-- core -->
  <g transform="translate(410 108)">
    <rect width="300" height="112" rx="12" fill="#1a1e2b" stroke="#7aa2f7" stroke-width="1.5"/>
    <text class="s h" x="20" y="30">Core</text>
    <text class="t dim" x="20" y="54">staging · atomic replace · advisory lock</text>
    <text class="t dim" x="20" y="72">overrides · session shards</text>
    <text class="t dim" x="20" y="90">verified push · auto-stash pull</text>
  </g>

  <!-- remote -->
  <g transform="translate(772 108)">
    <rect width="300" height="112" rx="12" fill="#1a1e2b" stroke="#bb9af7" stroke-width="1.5"/>
    <text class="s h" x="20" y="30">Private GitHub repo</text>
    <text class="t dim" x="20" y="56">plain git — no server, no service</text>
    <text class="t dim" x="20" y="76">inspectable, revertible history</text>
  </g>

  <line x1="348" y1="164" x2="404" y2="164" stroke="#565f89" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="164" x2="766" y2="164" stroke="#565f89" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766" y1="184" x2="710" y2="184" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- mapping -->
  <text class="s h" x="48" y="288">What travels</text>

  <g transform="translate(48 308)">
    <rect width="1024" height="150" rx="12" fill="#161a25" stroke="#292e42" stroke-width="1.5"/>

    <text class="t lbl"  x="24"  y="36">~/.config/opencode/</text>
    <text class="t dim"  x="300" y="36">→</text>
    <text class="t grn"  x="330" y="36">repo root</text>
    <text class="t dim"  x="470" y="36">config, agents, commands, skills, themes</text>

    <text class="t lbl"  x="24"  y="66">~/.local/share/opencode/</text>
    <text class="t dim"  x="300" y="66">→</text>
    <text class="t grn"  x="330" y="66">_data/</text>
    <text class="t dim"  x="470" y="66">project metadata, optional credentials</text>

    <text class="t lbl"  x="24"  y="96">~/.local/state/opencode/</text>
    <text class="t dim"  x="300" y="96">→</text>
    <text class="t grn"  x="330" y="96">_state/</text>
    <text class="t dim"  x="470" y="96">frecency, model cache, prompt history</text>

    <text class="t lbl"  x="24"  y="126">~/.agents/skills/</text>
    <text class="t dim"  x="300" y="126">→</text>
    <text class="t grn"  x="330" y="126">_agents/</text>
    <text class="t dim"  x="470" y="126">skills installed by the skills CLI</text>
  </g>

  <!-- what stays -->
  <text class="s h" x="48" y="500">What stays put</text>

  <g transform="translate(48 518)">
    <rect width="500" height="92" rx="12" fill="#161a25" stroke="#292e42" stroke-width="1.5"/>
    <text class="t pur" x="24" y="30">opencode-sync.overrides.jsonc</text>
    <text class="t dim" x="24" y="50">this machine's own settings, merged after every pull</text>
    <text class="t dim" x="24" y="72">never committed, never pushed, never overwritten</text>
  </g>

  <g transform="translate(572 518)">
    <rect width="500" height="92" rx="12" fill="#161a25" stroke="#292e42" stroke-width="1.5"/>
    <text class="t pur" x="24" y="30">opencode.db</text>
    <text class="t dim" x="24" y="50">multi-gigabyte, unmergeable, machine-local</text>
    <text class="t dim" x="24" y="72">selected sessions travel as shards in _sessions/</text>
  </g>
</svg>
